name: Auto-tag on version bump

on:
  push:
    branches: [master]
    paths:
      - "python/decord/_ffi/libinfo.py"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect version change
        id: version
        run: |
          CURRENT=$(grep -oP '(?<=__version__ = ")[^"]+' python/decord/_ffi/libinfo.py)
          PREVIOUS=$(git show HEAD~1:python/decord/_ffi/libinfo.py 2>/dev/null \
            | grep -oP '(?<=__version__ = ")[^"]+' || echo "")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.version.outputs.changed == 'true'
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          git tag "$TAG"
          git push origin "$TAG"
