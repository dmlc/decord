name: Build and Publish to PyPI

on:
  push:
    branches: [ master ]
    tags:
      - "v*"
  pull_request:
    branches: [ master ]

jobs:
  build_wheels:
    name: Build CPU wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pybuilds: cp3{10,11,12,13}-manylinux_x86_64
            arch: x86_64
            id: linux_x86_64
          - os: ubuntu-24.04-arm
            pybuilds: cp3{10,11,12,13}-manylinux_aarch64
            arch: aarch64
            id: linux_aarch64
          - os: macos-13
            pybuilds: cp3{10,11,12,13}-macosx_x86_64
            arch: x86_64
            id: macos_x86
          - os: macos-latest
            pybuilds: cp3{10,11,12,13}-macosx_arm64
            arch: arm64
            id: macos_arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build source package
        if: matrix.os == 'ubuntu-latest' # Only build sdist once
        run: |
          pip install -U build cython setuptools
          python scripts/fetch-vendor.py --config-file scripts/ffmpeg-7.1.json /tmp/vendor
      - name: Upload source package
        if: matrix.os == 'ubuntu-latest' # Only upload sdist once
        uses: actions/upload-artifact@v4
        with:
          name: dist-source
          path: dist/

      - name: Install cibuildwheel and dependencies
        run: |
          python -m pip install --upgrade pip pytest cibuildwheel==v3.0.0

      - name: Set Minimum MacOS Target
        if: matrix.os == 'macos-13' || matrix.os == 'macos-15' || matrix.os == 'macos-latest'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.0.0
        with:
          package-dir: python
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          OMPL_BUILD_ARCH: ${{ matrix.arch }}
          CIBW_BUILD: ${{ matrix.pybuilds }}
          CIBW_SKIP: "cp*-manylinux_i686 cp*-musllinux* cp*-win32 pp*"
          CIBW_TEST_SKIP: "cp311-* cp312-* cp313-* pp*"
          CIBW_BEFORE_BUILD_LINUX: |
            python scripts/fetch-vendor.py --config-file scripts/ffmpeg-7.1.json /tmp/vendor
            yum install -y epel-release
            yum install -y cmake make gcc gcc-c++ pkgconfig libbsd-devel soxr-devel alsa-lib-devel compat-openssl10
            rm -f /tmp/vendor/lib/libsoxr.so*
            mkdir build
            cd build
            cmake .. -DUSE_CUDA=0 -DCMAKE_BUILD_TYPE=Release
            make -j$(nproc)
            cp libdecord.so ..
          CIBW_BEFORE_BUILD_MACOS: |
            python scripts/fetch-vendor.py --config-file scripts/ffmpeg-7.1.json /tmp/vendor
            brew install cmake
            mkdir build
            cd build
            cmake .. -DUSE_CUDA=0 -DCMAKE_BUILD_TYPE=Release
            make -j$(sysctl -n hw.ncpu)
            cp libdecord.dylib ..
          CIBW_BEFORE_BUILD_WINDOWS: |
            python scripts\fetch-vendor.py --config-file scripts\ffmpeg-7.1.json C:\cibw\vendor
            choco install cmake ninja -y
            mkdir build
            cd build
            cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_CXX_FLAGS="/DDECORD_EXPORTS" -DCMAKE_CONFIGURATION_TYPES="Release" -DFFMPEG_INCLUDE_DIR="C:/cibw/vendor/include" -DFFMPEG_LIBRARIES="C:/cibw/vendor/lib/lib*.lib" ..
            cmake --build . --config Release
            cp libdecord.dll ..
            copy decord.dll ..
          CIBW_ENVIRONMENT_LINUX: LD_LIBRARY_PATH=/tmp/vendor/lib:$LD_LIBRARY_PATH PKG_CONFIG_PATH=/tmp/vendor/lib/pkgconfig
          CIBW_ENVIRONMENT_MACOS: PKG_CONFIG_PATH=/tmp/vendor/lib/pkgconfig LDFLAGS=-headerpad_max_install_names
          CIBW_ENVIRONMENT_WINDOWS: INCLUDE=C:/cibw/vendor/include LIB=C:/cibw/vendor/lib PYAV_SKIP_TESTS=unicode_filename
          CIBW_TEST_COMMAND: python -m pytest {project}/tests/python/unittests -v
          CIBW_TEST_REQUIRES: pytest numpy nose simpleaudio

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.id }}
          path: ./wheelhouse/*.whl

  build_cuda_wheels:
    name: Build CUDA wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            pybuilds: "cp3{10,11,12}-manylinux_x86_64"
            cuda_arch: "70;75;80;86;90"
            id: linux_x86_64_cuda
          - os: ubuntu-24.04-arm
            arch: aarch64
            pybuilds: "cp3{10,11,12}-manylinux_aarch64"
            cuda_arch: "80;86;90a" # Includes Hopper and Ada for ARM
            id: linux_aarch64_cuda

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.25
        with:
          cuda: '12.8.1'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==v3.0.0

      - name: Build wheels with CUDA
        uses: pypa/cibuildwheel@v3.0.0
        with:
          package-dir: python
        env:
          CIBW_BUILD: ${{ matrix.pybuilds }}
          CIBW_SKIP: "cp*-manylinux_i686 cp*-musllinux* cp*-win32 pp*"
          CIBW_TEST_SKIP: "*" # Skip all tests, as there is no GPU on the runner
          CIBW_BEFORE_BUILD_LINUX: |
            python scripts/fetch-vendor.py --config-file scripts/ffmpeg-7.1.json /tmp/vendor
            yum install -y epel-release
            yum install -y cmake make gcc gcc-c++ pkgconfig libbsd-devel soxr-devel alsa-lib-devel compat-openssl10
            rm -f /tmp/vendor/lib/libsoxr.so*
            mkdir build
            cd build
            cmake .. \
              -DUSE_CUDA=1 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCUDA_TOOLKIT_ROOT_DIR=${{ env.CUDA_PATH }} \
              -DCMAKE_CUDA_ARCHITECTURES="${{ matrix.cuda_arch }}"
            make -j$(nproc)
            cp libdecord.so ..
          CIBW_ENVIRONMENT_LINUX: >
            PATH=${{ env.CUDA_PATH }}/bin:$PATH
            LD_LIBRARY_PATH=${{ env.CUDA_PATH }}/lib64:/tmp/vendor/lib:$LD_LIBRARY_PATH
            PKG_CONFIG_PATH=/tmp/vendor/lib/pkgconfig
            CUDA_HOME=${{ env.CUDA_PATH }}
            NVCC_PATH=${{ env.CUDA_PATH }}/bin/nvcc
          CUDA_TAG: "cu128"

      - name: Rename wheels for CUDA version
        shell: bash
        run: |
          cd ./wheelhouse
          for wheel in ./*-manylinux_${{ matrix.arch }}.whl; do
            mv -- "$wheel" "${wheel//manylinux_${{ matrix.arch }}/manylinux_${{ matrix.arch }}_${{ env.CUDA_TAG }}}"
          done
          echo "Renamed wheels:"
          ls -la .
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.id }}
          path: ./wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_cuda_wheels] # Wait for both CPU and CUDA builds
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/decord2
    permissions:
      id-token: write

    steps:
      - name: Download all wheels and sdist
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: List downloaded files
        run: ls -R ./dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true

  testpypi:
    name: Publish to TestPyPI
    needs: [build_wheels, build_cuda_wheels] # Wait for both CPU and CUDA builds
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/decord
    permissions:
      id-token: write

    steps:
      - name: Download all wheels and sdist
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: List downloaded files
        run: ls -R ./dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository_url: https://test.pypi.org/legacy/
          skip_existing: true