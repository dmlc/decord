name: Build and Publish to PyPI

on:
  push:
    branches: [ master ]
    tags:
      - "v*"
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build CPU wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pybuilds: cp3{10,11,12,13,14,14t}-manylinux_x86_64
            arch: x86_64
            id: linux_x86_64
          - os: ubuntu-24.04-arm
            pybuilds: cp3{10,11,12,13,14,14t}-manylinux_aarch64
            arch: aarch64
            id: linux_aarch64
          - os: macos-latest
            pybuilds: cp3{10,11,12,13,14,14t}-macosx_arm64
            arch: arm64
            id: macos_arm64
          - os: windows-2022
            pybuilds: cp3{10,11,12,13,14,14t}-win_amd64
            arch: AMD64
            id: windows_x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          
      - name: Free up disk space
        if: ${{ runner.os == 'Linux' }}
        # https://github.com/easimon/maximize-build-space/blob/master/action.yml
        # https://github.com/easimon/maximize-build-space/tree/test-report
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build source package
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install -U build cython setuptools
          python scripts/fetch-vendor.py --config-file scripts/ffmpeg-8.1.json /tmp/vendor
      - name: Upload source package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: dist-source
          path: dist/*.tar.gz

      - name: Install cibuildwheel and dependencies
        run: |
          python -m pip install --upgrade pip pytest cibuildwheel==v3.4.1

      - name: Set Minimum MacOS Target
        if: runner.os == 'macOS'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: python
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ARCHS_WINDOWS: AMD64
          OMPL_BUILD_ARCH: ${{ matrix.arch }}
          CIBW_BUILD: ${{ matrix.pybuilds }}
          CIBW_SKIP: "cp*-manylinux_i686 cp*-musllinux* cp*-win32"
          # GH runners have no audio/display; simpleaudio + ALSA tests don't run on Windows.
          CIBW_TEST_SKIP: "cp311-* cp312-* cp313-* *-win_amd64"
          CIBW_BEFORE_BUILD_LINUX: |
            python scripts/fetch-vendor.py --config-file scripts/ffmpeg-8.1.json /tmp/vendor
            yum install -y epel-release
            yum install -y cmake make gcc gcc-c++ pkgconfig libbsd-devel soxr-devel alsa-lib-devel openssl-devel compat-openssl10
            rm -f /tmp/vendor/lib/libsoxr.so*
            mkdir build
            cd build
            cmake .. -DUSE_CUDA=OFF -DCMAKE_BUILD_TYPE=Release
            make -j$(nproc)
            cp libdecord.so ..
          CIBW_BEFORE_BUILD_MACOS: |
            python scripts/fetch-vendor.py --config-file scripts/ffmpeg-8.1.json /tmp/vendor
            brew install cmake
            mkdir build
            cd build
            cmake .. -DUSE_CUDA=OFF -DCMAKE_BUILD_TYPE=Release
            make -j$(sysctl -n hw.ncpu)
            cp libdecord.dylib ..
          # Windows runs BEFORE_BUILD in cmd.exe: every command must be one
          # logical line joined with `&&` (newlines are dropped). The vendored
          # FFmpeg ships MSVC import libs in C:/vendor/lib and DLLs in
          # C:/vendor/bin; -DFFMPEG_DIR points CMake at both. The built
          # decord.dll lands in build/Release where libinfo.find_lib_path looks.
          # The os.utime call re-stamps the vendored FFmpeg DLLs: pyav-ffmpeg
          # ships them with a 1970 mtime, and delvewheel's re-zip rejects
          # timestamps before 1980 ("ZIP does not support timestamps before 1980").
          CIBW_BEFORE_BUILD_WINDOWS: >
            pip install delvewheel &&
            python scripts/fetch-vendor.py --config-file scripts/ffmpeg-8.1.json C:/vendor &&
            python -c "import os,glob;[os.utime(f) for f in glob.glob('C:/vendor/bin/*.dll')]" &&
            cmake -S . -B build -G "Visual Studio 17 2022" -A x64
            -DUSE_CUDA=OFF -DCMAKE_BUILD_TYPE=Release -DFFMPEG_DIR=C:/vendor &&
            cmake --build build --config Release --parallel
          CIBW_ENVIRONMENT_LINUX: LD_LIBRARY_PATH=/tmp/vendor/lib:$LD_LIBRARY_PATH PKG_CONFIG_PATH=/tmp/vendor/lib/pkgconfig
          CIBW_ENVIRONMENT_MACOS: PKG_CONFIG_PATH=/tmp/vendor/lib/pkgconfig LDFLAGS=-headerpad_max_install_names
          # Bundle the FFmpeg DLLs (from C:/vendor/bin) into the wheel so it is
          # self-contained, just like auditwheel/delocate do on Linux/macOS.
          # --analyze-existing is REQUIRED: decord ships its native library as a
          # plain decord.dll loaded via ctypes (there is no .pyd extension), so
          # without it delvewheel never walks decord.dll's imports and vendors
          # nothing ("no external dependencies are needed").
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
            delvewheel repair --analyze-existing --add-path C:/vendor/bin -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: python -m pytest {project}/tests/python/unittests -v
          CIBW_TEST_REQUIRES: pytest numpy nose simpleaudio

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.id }}
          path: ./wheelhouse/*.whl

  build_cuda_wheels:
    name: Build CUDA wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            pybuilds: "cp3{10,11,12,13,14,14t}-manylinux_x86_64"
            cuda_arch: "80;90;100;110;120"
            id: linux_x86_64_cuda
          - os: ubuntu-24.04-arm
            arch: aarch64
            pybuilds: "cp3{10,11,12,13,14,14t}-manylinux_aarch64"
            cuda_arch: "80;90;100;110;120"
            id: linux_aarch64_cuda

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==v3.4.1

      - name: Build wheels with CUDA
        uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: python
        env:
          DECORD_LOCAL_VERSION_SUFFIX: +cu133
          CIBW_BUILD: ${{ matrix.pybuilds }}
          CIBW_SKIP: "cp*-manylinux_i686 cp*-musllinux* cp*-win32"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_TEST_SKIP: "*"
          # Keep the CUDA wheels compact WITHOUT losing GPU acceleration:
          # bundle FFmpeg (like the CPU wheels) but leave the CUDA runtime +
          # driver libraries EXTERNAL, mirroring the Windows policy. By default
          # auditwheel vendors libcudart/libnvrtc/libcublas(Lt)/cuDNN into every
          # wheel (~500 MB); excluding them drops the wheel to ~30 MB. NVDEC
          # still works because GPU users already provide CUDA at runtime (a
          # system CUDA install, the nvidia-*-cu13 pip packages, or a framework
          # such as PyTorch). The driver libs (libcuda/libnvcuvid/libnvidia-ml)
          # are never bundleable anyway. auditwheel still retags to manylinux.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair
            --exclude 'libcuda.so*' --exclude 'libcudart.so*'
            --exclude 'libnvrtc.so*' --exclude 'libnvrtc-builtins.so*'
            --exclude 'libnvJitLink.so*'
            --exclude 'libcublas.so*' --exclude 'libcublasLt.so*'
            --exclude 'libnvcuvid.so*' --exclude 'libnvidia-ml.so*'
            --exclude 'libcudnn*.so*'
            -w {dest_dir} {wheel}
          # BEFORE_ALL runs once per container.
          CIBW_BEFORE_ALL_LINUX: |
            set -ex
            # First, install the tool needed to add repositories
            yum install -y dnf-utils
            yum install -y cmake make gcc gcc-c++ pkgconfig libbsd-devel soxr-devel alsa-lib-devel compat-openssl10

            # Detect architecture and add the correct NVIDIA CUDA repo for RHEL 8-based manylinux
            ARCH=$(uname -m)
            if [ "$ARCH" == "x86_64" ]; then
              REPO_URL=https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
            elif [ "$ARCH" == "aarch64" ]; then
              REPO_URL=https://developer.download.nvidia.com/compute/cuda/repos/rhel8/sbsa/cuda-rhel8.repo
            else
              echo "Unsupported architecture: $ARCH"
              exit 1
            fi

            echo "--- Adding CUDA repo for $ARCH ---"
            yum-config-manager --add-repo ${REPO_URL}
            yum clean all

            echo "--- Installing CUDA Toolkit and build dependencies ---"
            # Install specific CUDA version and other build tools
            dnf -y module install nvidia-driver:open-dkms
            yum install -y \
            cuda-compiler-13-3-13.3.0-1 \
            cuda-libraries-13-3-13.3.0-1 \
            cuda-libraries-devel-13-3-13.3.0-1 \
            cuda-toolkit-13.3.0-1 \
            cudnn
            yum install -y cmake make gcc gcc-c++ pkgconfig libbsd-devel soxr-devel alsa-lib-devel compat-openssl10
            echo "--- Installing GCC Toolset 11 ---"
            yum install -y gcc-toolset-11

            # Enable the GCC 11 toolset for the rest of this script
            source /opt/rh/gcc-toolset-11/enable

            echo "--- Verifying CUDA installation ---"
            # The 'export' is not needed here as the CIBW_ENVIRONMENT_LINUX var will set the path later.
            # We just need to call it with the full path for verification.
            echo "--- Verifying GCC and CUDA installation ---"
            gcc --version
            /usr/local/cuda-13.3/bin/nvcc --version
          # BEFORE_BUILD runs for each python version.
          CIBW_BEFORE_BUILD_LINUX: |
            set -ex
            echo "--- Installing GCC Toolset 11 ---"
            yum install -y gcc-toolset-11
            source /opt/rh/gcc-toolset-11/enable
            python scripts/fetch-vendor.py --config-file scripts/ffmpeg-8.1.json /tmp/vendor
            rm -f /tmp/vendor/lib/libsoxr.so*

            # Use a fresh build directory for each Python version to prevent contamination.
            mkdir -p build && cd build
            echo "--- Running CMake with CUDA support ---"
            cmake .. \
              -DUSE_CUDA=ON \
              -DCMAKE_BUILD_TYPE=Release \
              -DCUDAToolkit_ROOT=/usr/local/cuda-13.3 \
              -DCMAKE_CUDA_ARCHITECTURES="${{ matrix.cuda_arch }}"
            echo "--- Building with make ---"
            make -j$(nproc)
            cp libdecord.so ..
          # Set environment variables for the build process inside the container
          CIBW_ENVIRONMENT_LINUX: >
            DECORD_LOCAL_VERSION_SUFFIX=+cu133
            PATH=/usr/local/cuda-13.3/bin:$PATH
            LD_LIBRARY_PATH=/usr/local/cuda-13.3/lib64:/tmp/vendor/lib:$LD_LIBRARY_PATH
            PKG_CONFIG_PATH=/tmp/vendor/lib/pkgconfig
          CUDA_TAG: "cu133"

      - name: Rename wheels for CUDA version
        shell: bash
        env:
          CUDA_TAG: "cu133"
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          cd ./wheelhouse
          echo "--- Original wheels ---"
          ls -1
          echo "--- Renaming wheels for CUDA version ${CUDA_TAG} ---"
          for wheel in ./*.whl; do
              [[ -e "$wheel" ]] || continue
              base=$(basename "$wheel")
              if [[ "$base" == *"+${CUDA_TAG}"* ]]; then
                  echo "Wheel '$base' already tagged with '+${CUDA_TAG}', skipping rename."
                  continue
              fi
              version=$(echo "$base" | grep -oP '(?<=decord2-)[^-]+')
              pyver=$(echo "$base" | grep -oP 'cp3[0-9]+-cp3[0-9]+')
              platform_tag="manylinux_2_28_${ARCH}"
              new_name="decord2-${version}+${CUDA_TAG}-${pyver}-${platform_tag}.whl"
              echo "Renaming '$base' → '$new_name'"
              mv "$wheel" "$new_name"
          done
          echo "--- Renamed wheels ---"
          ls -1
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.id }}
          path: ./wheelhouse/*.whl

  build_cuda_wheels_windows:
    name: Build CUDA wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x86_64
            pybuilds: "cp3{10,11,12,13,14,14t}-win_amd64"
            cuda: "13.3.0"
            cuda_arch: "80;90;100;110;120"
            id: windows_x86_64_cuda

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Install the CUDA Toolkit on the host with NVIDIA's LOCAL installer
      # (mirrors PyTorch's own Windows CI): download the self-extracting .exe,
      # unpack it with the preinstalled 7-Zip, then run setup.exe -s. The
      # network installer is brittle with custom component lists, and the
      # Jimver action hard-codes a version list that lags new CUDA releases.
      # CUDA 13.x default install (no component list) brings nvcc, cudart,
      # cublas, nvrtc, nvml and the nvcuvid/nvenc stubs; it no longer bundles
      # the GPU driver.
      - name: Install CUDA on host (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cudaVer = "${{ matrix.cuda }}"
          $cudaMajMin = ($cudaVer.Split('.')[0..1] -join '.')
          $installerName = "cuda_${cudaVer}_windows.exe"
          $url = "https://developer.download.nvidia.com/compute/cuda/${cudaVer}/local_installers/${installerName}"
          $installer = "$env:RUNNER_TEMP\$installerName"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing

          $extractDir = "$env:RUNNER_TEMP\cuda_extract"
          Write-Host "Extracting $installer -> $extractDir"
          & "C:\Program Files\7-Zip\7z.exe" x $installer "-o$extractDir" -y | Out-Null
          $setupExe = Join-Path $extractDir "setup.exe"
          if (-not (Test-Path $setupExe)) {
            Write-Host "ERROR: setup.exe not found after 7z extract"
            Get-ChildItem $extractDir | Select-Object -First 30
            exit 1
          }

          $logDir = Join-Path $extractDir "cuda_install_logs"
          Write-Host "Running: setup.exe -s"
          $proc = Start-Process -FilePath $setupExe -ArgumentList @("-s", "-loglevel:6", "-log:$logDir") -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Host "setup.exe exit code: $($proc.ExitCode)"
            Get-ChildItem $logDir -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "=== $($_.FullName) ==="
              Get-Content $_.FullName -Tail 200 -ErrorAction SilentlyContinue
            }
            exit 1
          }

          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${cudaMajMin}"
          if (-not (Test-Path "${cudaPath}\bin\nvcc.exe")) {
            Write-Host "ERROR: nvcc.exe missing at ${cudaPath}\bin"
            Get-ChildItem "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\" -ErrorAction SilentlyContinue
            exit 1
          }
          Add-Content $env:GITHUB_ENV "CUDA_PATH=${cudaPath}"
          # The MSBuild CUDA integration used by CMake's Visual Studio generator
          # resolves the toolkit from the versioned CUDA_PATH_V<MAJ>_<MIN> env var
          # (e.g. CUDA_PATH_V13_3), NOT from -DCUDAToolkit_ROOT. Export it too.
          $cudaPathVar = "CUDA_PATH_V" + ($cudaMajMin -replace '\.', '_')
          Add-Content $env:GITHUB_ENV "${cudaPathVar}=${cudaPath}"
          Add-Content $env:GITHUB_PATH "${cudaPath}\bin"
          & "${cudaPath}\bin\nvcc.exe" --version

      # Put the MSVC toolchain (notably lib.exe) on PATH so BEFORE_BUILD can
      # synthesize the nvcuvid import library from scripts/nvcuvid.def.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==v3.4.1

      - name: Build wheels with CUDA
        uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: python
        env:
          CIBW_BUILD: ${{ matrix.pybuilds }}
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_SKIP: "cp*-win32"
          CIBW_TEST_SKIP: "*"
          # Bake +cu133 into the wheel version so the filename/metadata match.
          CIBW_ENVIRONMENT_WINDOWS: DECORD_LOCAL_VERSION_SUFFIX=+cu133
          # Windows BEFORE_BUILD runs in cmd.exe: one logical line joined by
          # `&&` (%CUDA_PATH% is set on the host by the install step above).
          # nvcuvid.lib is not in the CUDA toolkit, so we synthesize an import
          # library from scripts/nvcuvid.def with lib.exe (the matching
          # nvcuvid.dll is provided by the driver at runtime) and point CMake at
          # it via -DCUDA_NVCUVID_LIBRARY.
          CIBW_BEFORE_BUILD_WINDOWS: >
            pip install delvewheel &&
            python scripts/fetch-vendor.py --config-file scripts/ffmpeg-8.1.json C:/vendor &&
            python -c "import os,glob;[os.utime(f) for f in glob.glob('C:/vendor/bin/*.dll')]" &&
            lib /def:scripts\nvcuvid.def /machine:x64 /out:C:\vendor\lib\nvcuvid.lib &&
            cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T "cuda=%CUDA_PATH%"
            -DUSE_CUDA=ON -DCMAKE_BUILD_TYPE=Release -DFFMPEG_DIR=C:/vendor
            -DCMAKE_CUDA_ARCHITECTURES="${{ matrix.cuda_arch }}"
            -DCUDAToolkit_ROOT="%CUDA_PATH%"
            -DCUDA_NVCUVID_LIBRARY=C:/vendor/lib/nvcuvid.lib &&
            cmake --build build --config Release --parallel
          # Bundle the FFmpeg DLLs but keep the CUDA runtime EXTERNAL: GPU wheels
          # rely on the user's CUDA install/driver. CUDA bin is added to the
          # search path only so delvewheel can resolve (and then exclude) them.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
            delvewheel repair --analyze-existing --add-path "C:/vendor/bin;%CUDA_PATH%/bin"
            --exclude "cudart64_13.dll;nvrtc64_130_0.dll;nvrtc-builtins64_133.dll;cublas64_13.dll;cublasLt64_13.dll;nvml.dll;nvcuvid.dll;nvencodeapi64.dll"
            -w {dest_dir} {wheel}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.id }}
          path: ./wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [build_wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: release
      url: https://pypi.org/p/decord2
    permissions:
      id-token: write
    steps:
      - name: Download all wheels and sdist
        uses: actions/download-artifact@v7
        with:
          path: ./dist
          merge-multiple: true

      - name: Remove CUDA wheels (not published to PyPI)
        run: rm -f ./dist/*+cu*.whl

      - name: List downloaded files
        run: ls -R ./dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true

  release:
    name: Create GitHub Release
    needs: [publish, build_cuda_wheels, build_cuda_wheels_windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lh ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.whl
            artifacts/*.tar.gz
